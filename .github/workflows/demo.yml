# Runs the demo the way a newcomer does, on a clean Linux machine, and
# checks it end to end (.github/scripts/e2e-test.py: login of the three
# users, API calls, ACR step-up with OTP, logout):
#   - Docker mode: clone.sh, then docker compose up --build;
#   - developer mode: clone.sh, then scripts/dev.sh up on a JDK.
# Also run every Monday, against the current trust-security.
name: demo

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Clone trust-security
        run: ./scripts/clone.sh
      - name: Start
        run: docker compose up --build -d
      - name: Wait for the samples
        run: |
          for port in 9083 9082 9081; do
            for i in $(seq 1 120); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port/" || true)
              [ "$code" != "000" ] && { echo "[OK] port $port answers ($code)"; continue 2; }
              sleep 2
            done
            echo "port $port does not answer"; exit 1
          done
      - name: End-to-end test
        run: python3 .github/scripts/e2e-test.py
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  developer:
    name: Developer mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Clone trust-security
        run: ./scripts/clone.sh
      - name: Cache the Maven distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      # Maven Central now and then refuses a download from a shared runner.
      - name: Download Maven
        run: for i in 1 2 3 4 5; do ./mvnw -B --version && exit 0; sleep $((i * 10)); done; exit 1
      - name: Start
        run: ./scripts/dev.sh up
      - name: End-to-end test
        run: python3 .github/scripts/e2e-test.py
      - name: Logs
        if: failure()
        run: tail -n 200 build/samples/*.log; docker compose logs --no-color keycloak keycloak-setup
      - name: Stop
        if: always()
        run: ./scripts/dev.sh down
